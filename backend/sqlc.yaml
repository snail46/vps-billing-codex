version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/migrations/sql/000001_initial.up.sql"
      - "internal/migrations/sql/000002_identity.up.sql"
      - "internal/migrations/sql/000003_commerce.up.sql"
      - "internal/migrations/sql/000004_subscription.up.sql"
      - "internal/migrations/sql/000005_infrastructure.up.sql"
      - "internal/migrations/sql/000006_operations.up.sql"
      - "internal/migrations/sql/000007_provision.up.sql"
      - "internal/migrations/sql/000008_user_portal.up.sql"
      - "internal/migrations/sql/000009_admin_portal.up.sql"
      - "internal/migrations/sql/000010_runman.up.sql"
      - "internal/migrations/sql/000011_reconciler.up.sql"
      - "internal/migrations/sql/000012_release_hardening.up.sql"
      - "internal/migrations/sql/000013_v2_catalog.up.sql"
      - "internal/migrations/sql/000014_v2_operations_nat.up.sql"
      - "internal/migrations/sql/000015_v2_provider_platform.up.sql"
      - "internal/migrations/sql/000016_v2_scheduler.up.sql"
      - "internal/migrations/sql/000017_v2_usage_billing.up.sql"
      - "internal/migrations/sql/000018_v2_reliability.up.sql"
      - "internal/migrations/sql/000019_v2_commercial.up.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
