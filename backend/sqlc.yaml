version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/migrations/sql/000001_initial.up.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
