version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/migrations/sql/000001_initial.up.sql"
      - "internal/migrations/sql/000002_identity.up.sql"
      - "internal/migrations/sql/000003_commerce.up.sql"
      - "internal/migrations/sql/000004_subscription.up.sql"
      - "internal/migrations/sql/000005_infrastructure.up.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
